<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fluxbridge" />
  <title>Fluxbridge</title>
  <script nonce="{{ nonce }}">
    // Resolve the theme before first paint (no flash): explicit choice, else OS.
    (function () {
      try {
        var t = localStorage.getItem("fb_theme");
        if (!t || t === "system") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="/static/v/{{ version }}/css/tokens.css" />
  <link rel="stylesheet" href="/static/v/{{ version }}/css/base.css" />
  <link rel="stylesheet" href="/static/v/{{ version }}/css/layout.css" />
  <link rel="stylesheet" href="/static/v/{{ version }}/css/components.css" />
  <link rel="stylesheet" href="/static/v/{{ version }}/css/pages.css" />
</head>
<body>
  <div class="shell" id="shell">
    <div class="scrim" id="scrim"></div>
    <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view"></main>
    </div>
  </div>
  <div id="drawerRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script nonce="{{ nonce }}">window.__FB_VERSION__ = "{{ version }}";</script>
  <!-- the module graph is four levels deep: preloading it flattens the waterfall -->
  <link rel="modulepreload" href="/static/v/{{ version }}/js/actions.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/api.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/charts.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/components/drawer.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/components/form.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/components/sidebar.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/components/table.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/components/topbar.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/i18n.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/icons.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/accounts.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/agents.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/calendar.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/copy.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/discord.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/discordSettings.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/guide.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/index.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/journal.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/logs.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/marketplace.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/news.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/overview.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/settings.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/simulator.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/tools.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/users.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/pages/webhooks.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/privacy.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/push.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/router.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/sizing.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/store.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/stream.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/templates.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/theme.js">
  <link rel="modulepreload" href="/static/v/{{ version }}/js/ui.js">
  <script type="module" src="/static/v/{{ version }}/js/app.js"></script>
</body>
</html>
